  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root { --ink: #1c2420; --muted: #5c665a; --accent: #2f6b3a; --panel: #ffffff; --border: #d9e0d8; --tractor: #d55e00; --cable: #0072b2; }
    html, body { height: 100%; margin: 0; }
    html { font-size: 16px; }
    body { display: flex; flex-direction: column; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #eef1ea; }
    #bar { position: relative; flex: none; z-index: 1000; background: var(--panel); border-bottom: 1px solid var(--border); padding: 0.55rem 1rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; align-items: baseline; }
    #bar h1 { font-size: 1.05rem; margin: 0; }
    #bar .sub { color: var(--muted); font-size: 0.875rem; }
    #bar nav a { color: var(--accent); text-decoration: none; display: inline-block; padding: 0.55rem 0.6rem 0.55rem 0; margin-right: 0.5rem; font-size: 0.95rem; }
    #bar nav a:hover { text-decoration: underline; }
    #about-toggle { display: none; }
    #map { position: relative; flex: 1 1 auto; min-height: 0; }
    .legend { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 0.7rem; font-size: 0.875rem; line-height: 1.5; max-width: 250px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .legend summary { cursor: pointer; font-weight: 600; font-size: 0.85rem; margin: 0 0 0.25rem; padding: 0.3rem 0; }
    /* layer list: 18 px boxes on 28 px rows, so each target clears WCAG 2.2's 24 px spacing */
    .leaflet-control-layers label > span { display: flex; align-items: center; gap: 0.4rem; min-height: 28px; }
    .leaflet-control-layers-selector { width: 18px; height: 18px; margin: 0; flex: none; }
    /* phones: a compact bar (subtitle behind "About this map"), so the map keeps most of the screen */
    @media (max-width: 699px) {
      #bar { padding: 0.4rem 0.75rem 0.2rem; gap: 0 0.6rem; }
      #bar h1 { font-size: 0.95rem; flex-basis: 100%; }
      #bar .sub { display: none; order: 2; flex-basis: 100%; padding-bottom: 0.35rem; }
      #bar.show-about .sub { display: block; }
      #bar nav { order: 1; flex-basis: 100%; display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      #bar nav::-webkit-scrollbar { display: none; }
      #bar nav a { flex: none; padding: 0.5rem 0.55rem 0.5rem 0; margin-right: 0.35rem; font-size: 0.875rem; }
      #about-toggle { display: inline-flex; flex: none; align-items: center; margin: 0.2rem 0.6rem 0.2rem 0; padding: 0.25rem 0.65rem; border: 1px solid var(--border); border-radius: 999px; background: #f6f7f3; color: var(--ink); font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    }
    .legend .row { display: flex; align-items: center; gap: 0.45rem; }
    .legend .sw { width: 22px; height: 12px; flex: none; border-radius: 2px; box-sizing: border-box; }
    .legend .ln { width: 22px; height: 0; flex: none; }
    .legend .note { color: var(--muted); font-size: 0.8rem; margin-top: 0.35rem; }
    .leaflet-popup-content { font-size: 0.9rem; line-height: 1.4; margin: 10px 12px; }
    .leaflet-popup-content .pt { margin: 0 0 0.3rem; font-size: 0.95rem; font-weight: 600; }
    .leaflet-popup-content table { border-collapse: collapse; }
    .leaflet-popup-content td { padding: 1px 6px 1px 0; vertical-align: top; }
    .leaflet-popup-content td:first-child { color: var(--muted); white-space: nowrap; }
    .leaflet-control-layers { font-size: 0.9rem; }
    /* unit number in a circle, the sale-area-map callout used on the printed sheets */
    .unit-no { background: rgba(255,255,255,0.92); border: 1px solid #1c2420; border-radius: 50%;
               width: 30px; height: 30px; line-height: 28px; text-align: center;
               font-size: 0.78rem; font-weight: 700; color: #1c2420; white-space: nowrap; pointer-events: none; }
  </style>
</head>
<body>
  <header id="bar">
    <h1>Mohawk Valley West Slope: harvest-unit planning</h1>
    <span class="sub" id="about-map">Demo block from public data: USGS 3DEP LiDAR 2018, USFS EDW, NHD, BLM, Census. Not a Forest Service proposal. Cruise plots are simulated.</span>
    <nav aria-label="Project links">
      <button type="button" id="about-toggle" aria-expanded="false" aria-controls="about-map">About this map</button>
      <a href="../../../#gis-projects">Portfolio</a>
      <a href="https://github.com/williamsteinley/plumas-lidar-harvest-planning" target="_blank" rel="noopener">Repository</a>
      <a href="https://github.com/williamsteinley/plumas-lidar-harvest-planning/releases/tag/v1.1" target="_blank" rel="noopener">Map sheets and GeoPDFs</a>
      <a href="https://github.com/williamsteinley/plumas-lidar-harvest-planning/blob/main/docs/methods.md" target="_blank" rel="noopener">Methods</a>
    </nav>
  </header>
  <main id="map" aria-label="Interactive harvest-unit planning map"></main>
  <script>
    const map = L.map('map', { zoomControl: true });
    const usgsTopo = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Basemap: USGS The National Map (public domain)' });
    const usgsImg = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Basemap: USGS The National Map, imagery with topo (public domain)' });
    usgsTopo.addTo(map);
    L.control.scale({ imperial: true, metric: false }).addTo(map);
    map.attributionControl.addAttribution('Analysis: William Steinley, <a href="https://github.com/williamsteinley/plumas-lidar-harvest-planning">plumas-lidar-harvest-planning</a> (CC BY 4.0)');

    const D = 'data/';
    // Round half to even, as the printed sheets do (Python's format), so a 52.5 % slope reads 52 % here and on the sheet.
    const fmt = (v, d = 0) => {
      if (v === '' || v === null || v === undefined || isNaN(v)) return '-';
      const s = Math.pow(10, d), x = Number(v) * s, f = Math.floor(x);
      const r = Math.abs(x - f - 0.5) < 1e-9 ? (f % 2 === 0 ? f : f + 1) : Math.round(x);
      return (r / s).toLocaleString('en-US', { maximumFractionDigits: d });
    };
    const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
    // On a phone a popup has to fit between the zoom buttons (left) and the layer button (right), or its title and
    // close button open underneath them; the auto-pan padding keeps it from being panned back under them.
    const narrow = window.innerWidth < 700;
    const P = narrow
      ? { maxWidth: Math.max(170, window.innerWidth - 140), maxHeight: Math.round(document.getElementById('map').clientHeight * 0.68),
          autoPanPaddingTopLeft: L.point(50, 12), autoPanPaddingBottomRight: L.point(62, 12) }
      : { maxWidth: 340 };
    const methodColor = m => m === 'Cable' ? getComputedStyle(document.documentElement).getPropertyValue('--cable').trim() : getComputedStyle(document.documentElement).getPropertyValue('--tractor').trim();

    const layers = {};
    const overlays = {};
    const loads = [];
    function add(name, file, opts, addNow) {
      const p = fetch(D + file).then(r => r.json()).then(gj => {
        const lyr = L.geoJSON(gj, opts);
        layers[name] = lyr; overlays[name] = lyr;
        if (addNow) lyr.addTo(map);
        return lyr;
      });
      loads.push(p); return p;
    }

    // yarding class overlay
    const yc = fetch(D + 'yarding_class.json').then(r => r.json()).then(meta => {
      const img = L.imageOverlay(D + 'yarding_class.png', meta.bounds, { opacity: 1, interactive: false, alt: 'Yarding class from planning slope' });
      overlays['Yarding class (planning slope)'] = img; img.addTo(map); return img;
    });
    loads.push(yc);

    add('Treatment block (USFS EDW)', 'block.geojson', { style: { color: '#111', weight: 2.5, dashArray: '8 5', fill: false } }, true);
    add('Riparian conservation areas', 'rca.geojson', { style: { color: '#7fb3d5', weight: 0.6, fillColor: '#bcd7ea', fillOpacity: 0.35 },
      onEachFeature: (f, l) => l.bindPopup(`<div class="pt">Riparian conservation area</div><table>${row('Stream class', f.properties.class)}${row('Width', fmt(f.properties.width_ft) + ' ft each side')}</table><p>SNFPA widths, shown for context. Not an exclusion zone.</p>`, P) }, false);
    add('Stream equipment exclusion zones', 'eez.geojson', { style: { color: '#2e6da4', weight: 0.8, fillColor: '#5da2d8', fillOpacity: 0.45 },
      onEachFeature: (f, l) => l.bindPopup(`<div class="pt">Equipment exclusion zone</div><table>${row('Stream class', f.properties.class)}${row('Width', fmt(f.properties.width_ft) + ' ft each side')}</table><p>Netted out of unit acres.</p>`, P) }, true);
    add('Streams (NHD)', 'streams.geojson', { style: f => ({ color: '#0070c0', weight: f.properties.class === 'perennial' ? 2.2 : 1.3, dashArray: f.properties.class === 'intermittent' ? '6 4' : (f.properties.class === 'ephemeral' ? '2 4' : null) }),
      onEachFeature: (f, l) => l.bindPopup(`<div class="pt">${f.properties.name || 'Unnamed stream'}</div><table>${row('Class', f.properties.class)}</table>`, P) }, true);
    add('Contours, 200 ft', 'contours200.geojson', { style: { color: '#96502d', weight: 0.9, opacity: 0.8 }, onEachFeature: (f, l) => l.bindTooltip(fmt(f.properties.elev) + ' ft', { sticky: true }) }, false);
    add('Feasible skyline corridors', 'corridors_feasible.geojson', { style: { color: '#222', weight: 0.7, opacity: 0.55 },
      onEachFeature: (f, l) => l.bindPopup(`<div class="pt">Skyline corridor, unit ${f.properties.unit_id}</div><table>${row('Landing', f.properties.landing_id)}${row('Span', fmt(f.properties.span_ft) + ' ft')}${row('Mid-span deflection', fmt(f.properties.deflection_pct, 1) + ' %')}${row('Minimum clearance', fmt(f.properties.min_clear_ft) + ' ft')}${row('Direction', f.properties.downhill ? 'downhill yarding' : 'uphill yarding')}${row('Span class', f.properties.span_class)}</table>`, P) }, false);
    add('Candidate landings', 'landings.geojson', { pointToLayer: (f, ll) => L.circleMarker(ll, { radius: f.properties.corridors_ok > 0 ? 4.5 : 3, color: '#333', weight: 1, fillColor: f.properties.corridors_ok > 0 ? '#ffd400' : '#bbb', fillOpacity: 0.95 }),
      onEachFeature: (f, l) => l.bindPopup(`<div class="pt">Landing ${f.properties.landing_id}, unit ${f.properties.unit_id}</div><table>${row('Elevation', fmt(f.properties.elev) + ' ft')}${row('Feasible corridors', fmt(f.properties.corridors_ok))}${row('Unit coverage', fmt(f.properties.coverage_pct) + ' %')}</table>`, P) }, false);
    add('Cruise plots (simulated)', 'plots.geojson', { pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 3, color: '#444', weight: 0.8, fillColor: f.properties.flags ? '#e63946' : '#ffffff', fillOpacity: 0.95 }),
      onEachFeature: (f, l) => l.bindPopup(`<div class="pt">Plot ${f.properties.plot}, unit ${f.properties.unit_id}</div><table>${row('Trees tallied', fmt(f.properties.n_trees))}${row('Slope', fmt(f.properties.slope) + ' %')}${row('QA flags', f.properties.flags || 'none')}</table><p>Simulated BAF 20 cruise. No crew measured these trees.</p>`, P) }, false);

    let selected = null;
    const select = l => { if (selected) selected.setStyle(unitStyle(selected.feature)); l.setStyle({ weight: 4.5, color: '#000', fillOpacity: 0.02 }); selected = l; };
    // Where to hang a unit number. A polygon centroid falls outside a curved unit (405 is the one here), so when it
    // does, scan horizontal lines across the unit and take the middle of its widest inside run - the same reason the
    // printed sheets place the number inside the unit and put the rest on a leader.
    const inRing = (pt, ring) => {
      let c = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
        if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) c = !c;
      }
      return c;
    };
    function labelPoint(feature, fallback) {
      const polys = feature.geometry.type === 'Polygon' ? [feature.geometry.coordinates] : feature.geometry.coordinates;
      const inside = pt => polys.some(p => inRing(pt, p[0]) && !p.slice(1).some(h => inRing(pt, h)));
      if (inside([fallback.lng, fallback.lat])) return fallback;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      polys.forEach(p => p[0].forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }));
      let best = null, bestLen = 0;
      for (let r = 1; r < 24; r++) {
        const y = y0 + (y1 - y0) * r / 24;
        let runStart = null;
        for (let c = 0; c <= 160; c++) {
          const x = x0 + (x1 - x0) * c / 160;
          if (inside([x, y])) { if (runStart === null) runStart = x; }
          else if (runStart !== null) { if (x - runStart > bestLen) { bestLen = x - runStart; best = [(runStart + x) / 2, y]; } runStart = null; }
        }
        if (runStart !== null && x1 - runStart > bestLen) { bestLen = x1 - runStart; best = [(runStart + x1) / 2, y]; }
      }
      return best ? L.latLng(best[1], best[0]) : fallback;
    }
    const unitStyle = f => ({ color: methodColor(f.properties.method), weight: 2.6, fillColor: methodColor(f.properties.method), fillOpacity: 0.06 });
    // The units go on as a group: a white casing, the method-colored boundary over it, and the unit number in a circle.
    // Neighboring units of the same method share an edge, and without the white seam that common boundary disappears
    // into one shape; the printed sheets case the cutting-unit boundary for the same reason.
    const unitGroup = L.layerGroup(); overlays['Harvest units (demonstration)'] = unitGroup; layers['Harvest units (demonstration)'] = unitGroup;
    const unitsLoaded = fetch(D + 'units.geojson').then(r => r.json()).then(gj => {
      const casing = L.geoJSON(gj, { style: { color: '#ffffff', weight: 6, opacity: 0.9, fill: false, lineJoin: 'round' }, interactive: false });
      // sheet numbers follow the printed series: the overview is sheet 1, then one sheet per unit in id order
      const sheetOf = {}; gj.features.map(f => +f.properties.unit_id).sort((x, y) => x - y).forEach((id, i) => { sheetOf[id] = i + 2; });
      const faces = L.geoJSON(gj, {
        style: unitStyle,
        onEachFeature: (f, l) => {
          const p = f.properties; const cable = p.method === 'Cable';
          let html = `<div class="pt">Unit ${p.unit_id}, ${p.method}</div><table>` +
            row('Gross / net acres', `${fmt(p.acres)} / ${fmt(p.net_acres)}`) + row('Mean slope', `${fmt(p.slope_mean)} % (98th pct ${fmt(p.slope_max)} %)`) +
            row('Aspect', p.aspect) + row('Elevation', `${fmt(p.elev_min)} to ${fmt(p.elev_max)} ft`) + row('Canopy cover', `${fmt(p.cover_pct)} %`) +
            row('Dominant height', `${fmt(p.dom_ht)} ft`) + row('Nearest road', p.road_ft < 1 ? 'inside unit' : `${fmt(p.road_ft)} ft`);
          if (cable) {
            html += row('Landings selected', `${p.landings_used} of ${p.landings}`) + row('Feasible corridors', `${fmt(p.corridors_feasible)} of ${fmt(p.corridors)}`) +
              row('Unit coverage', `${fmt(p.coverage_pct)} %`) + row('Mean deflection', `${fmt(p.mean_deflection_pct, 1)} %`) + row('Longest feasible span', `${fmt(p.max_feasible_span_ft)} ft`) +
              row('Equipment', p.equipment) + row('Difficulty', p.difficulty) + (p.payload_at_best_lb ? row('Allowable load', `${fmt(p.payload_at_best_lb)} lb (7/8 in skyline, SF 3)`) : '');
          } else {
            html += row('System', 'ground-based') + (p.corridors_feasible !== '' ? row('If cable', `${fmt(p.corridors_feasible)} feasible corridors, ${fmt(p.coverage_pct)} % coverage`) : '');
          }
          html += row('Printed sheet', `${sheetOf[+p.unit_id]} of 25`) + '</table>';
          l.bindPopup(html, P);
          l.bindTooltip(`Unit ${p.unit_id}, ${p.method}`, { sticky: true });   // hover still names the unit when the numbers are hidden at low zoom
          l.on('click', () => { select(l); history.replaceState(null, '', '#unit=' + p.unit_id); });
        }
      });
      unitGroup.addLayer(casing).addLayer(faces).addTo(map);
      // #unit=404 opens the map on that unit with its attributes showing, so a unit can be linked to directly
      const byId = {}; faces.eachLayer(l => { byId[l.feature.properties.unit_id] = l; });
      const fromHash = () => {
        const m2 = /#unit=(\w+)/.exec(location.hash); const l = m2 && byId[m2[1]];
        if (!l) return false;
        map.fitBounds(l.getBounds().pad(0.6)); select(l); l.openPopup(); return true;
      };
      if (!fromHash()) map.fitBounds(faces.getBounds().pad(0.05));
      window.addEventListener('hashchange', fromHash);
      // numbers as their own marker layer rather than permanent tooltips: a tooltip is not closed when its layer goes
      // out with the group, and unchecking the units in the layer list left 24 numbers floating over the basemap.
      // Polygon.getCenter is a true centroid but throws until the layer is on the map and the map has a view,
      // so this runs after addTo and after the fitBounds above.
      const numbers = L.layerGroup();
      faces.eachLayer(l => numbers.addLayer(L.marker(labelPoint(l.feature, l.getCenter()), {
        icon: L.divIcon({ className: 'unit-no', html: String(l.feature.properties.unit_id), iconSize: [30, 30] }),
        interactive: false, keyboard: false
      })));
      // a unit has to be a few hundred feet across before its number is legible; below that they pile up
      // one zoom level later on a phone, where 24 circles at zoom 13 touch each other
      const numbersFrom = () => window.innerWidth < 700 ? 14 : 13;
      const zoomNumbers = () => { if (map.getZoom() >= numbersFrom()) unitGroup.addLayer(numbers); else unitGroup.removeLayer(numbers); };
      map.on('zoomend', zoomNumbers); zoomNumbers();
      return unitGroup;
    });
    loads.push(unitsLoaded);

    Promise.all(loads).catch(err => {
      console.error('Layer load failed', err);
      document.getElementById('bar').insertAdjacentHTML('beforeend', '<span class="sub" style="color:#a4262c">Some map layers failed to load. Reload the page to try again.</span>');
    }).then(() => {
      const order = ['Yarding class (planning slope)', 'Riparian conservation areas', 'Stream equipment exclusion zones', 'Streams (NHD)', 'Contours, 200 ft', 'Treatment block (USFS EDW)', 'Feasible skyline corridors', 'Candidate landings', 'Cruise plots (simulated)', 'Harvest units (demonstration)'];
      const ov = {}; order.forEach(k => { if (overlays[k]) ov[k] = overlays[k]; });
      L.control.layers({ 'USGS Topo': usgsTopo, 'USGS Imagery Topo': usgsImg }, ov, { collapsed: window.innerWidth < 700 }).addTo(map);
      // units last, and a layer group has no bringToFront of its own: raise its members in order, casing then faces
      order.forEach(k => { const l = overlays[k]; if (!l || !map.hasLayer(l)) return; if (l.bringToFront) l.bringToFront(); else if (l.eachLayer) l.eachLayer(x => x.bringToFront && x.bringToFront()); });
      fitCorners();
    });

    // On a phone the credits wrap to two lines across the whole bottom edge and run under the scale bar and legend.
    // Lift the bottom-left corner by the credits' height whenever the two would overlap.
    function fitCorners() {
      const credits = document.querySelector('.leaflet-control-attribution');
      const corner = document.querySelector('.leaflet-bottom.leaflet-left');
      if (!credits || !corner) return;
      corner.style.bottom = '0px';
      const a = credits.getBoundingClientRect(), c = corner.getBoundingClientRect();
      if (a.width > 0 && a.left < c.right) corner.style.bottom = Math.ceil(a.height) + 'px';
    }
    map.on('baselayerchange', fitCorners);
    window.addEventListener('resize', fitCorners);

    // "About this map" shows the data note on phones, where the bar hides it to give the map the screen.
    const bar = document.getElementById('bar'), aboutToggle = document.getElementById('about-toggle');
    aboutToggle.addEventListener('click', () => {
      const open = bar.classList.toggle('show-about');
      aboutToggle.setAttribute('aria-expanded', String(open));
      map.invalidateSize();
      fitCorners();
    });

    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = () => {
      const d = L.DomUtil.create('details', 'legend');
      d.open = window.innerWidth > 700;
      d.innerHTML = `<summary>Legend</summary>
        <div class="row"><span class="sw" style="border:2.5px solid var(--tractor);box-shadow:0 0 0 2px #fff"></span>Tractor unit</div>
